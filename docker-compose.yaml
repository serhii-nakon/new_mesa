services:

  build32:
    build:
      context: .
      dockerfile: Dockerfile32
      # Taken from the environment ("MESA_VERSION=26.2.2 docker compose build").
      # When not set, defaults declared in the Dockerfile are used.
      args:
        - MESA_VERSION
        - LIBDRM_VERSION
    privileged: true
    volumes:
      - "./:/home/jenkins/out"

  build64:
    build:
      context: .
      dockerfile: Dockerfile64
      args:
        - MESA_VERSION
        - LIBDRM_VERSION
    privileged: true
    volumes:
      - "./:/home/jenkins/out"
