services:

  build32:
    build:
      context: .
      dockerfile: Dockerfile
      # MESA_VERSION and LIBDRM_VERSION are taken from the environment
      # ("MESA_VERSION=26.2.2 docker compose build"), when not set defaults
      # declared in the Dockerfile are used
      args:
        - MESA_VERSION
        - LIBDRM_VERSION
        - HOST_UID
        - PLATFORM=linux/386
        - BITS=32
        - TRIPLET=i386-linux-gnu
    privileged: true
    volumes:
      - "./:/home/jenkins/out"

  build64:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - MESA_VERSION
        - LIBDRM_VERSION
        - HOST_UID
        - PLATFORM=linux/amd64
        - BITS=64
        - TRIPLET=x86_64-linux-gnu
    privileged: true
    volumes:
      - "./:/home/jenkins/out"
