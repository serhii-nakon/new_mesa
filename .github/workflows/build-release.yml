name: Build Mesa and publish release

on:
  workflow_dispatch:
    inputs:
      mesa_version:
        description: "Mesa version (release tag is taken from it)"
        required: true
        default: "26.2.2"
      libdrm_version:
        description: "LibDRM version"
        required: true
        default: "2.4.134"
  push:
    branches:
      - master
    paths:
      - "Dockerfile32"
      - "Dockerfile64"
      - "docker-compose.yaml"
      - ".github/workflows/build-release.yml"

jobs:
  build:
    name: Build Mesa
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      # Inputs are empty on push, so defaults are duplicated here - keep in sync
      MESA_VERSION: ${{ inputs.mesa_version || '26.2.2' }}
      LIBDRM_VERSION: ${{ inputs.libdrm_version || '2.4.134' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build mesa32 and mesa64
        run: |
          set -euo pipefail
          # Containers copy the result into the bind mounted workspace, so the
          # user inside them is created with the uid of the runner user
          export HOST_UID="$(id -u)"
          docker compose up --build
          ls -l mesa32 mesa64

      - name: Archive into mesa.tar.xz
        run: |
          set -euo pipefail
          XZ_OPT="-9 -T0" tar -cJf mesa.tar.xz mesa32 mesa64
          ls -lh mesa.tar.xz

      - name: Publish release
        run: |
          set -euo pipefail
          TITLE="Mesa ${MESA_VERSION}, LibDRM ${LIBDRM_VERSION}"

          if gh release view "${MESA_VERSION}" >/dev/null 2>&1; then
            gh release edit "${MESA_VERSION}" --title "${TITLE}"
            gh release upload "${MESA_VERSION}" mesa.tar.xz --clobber
          else
            gh release create "${MESA_VERSION}" mesa.tar.xz \
              --target "${GITHUB_SHA}" \
              --title "${TITLE}" \
              --notes ""
          fi
